{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Páginas"><span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;environment={{ selected_environment|urlencode }}">Anterior</a>{% endif %}{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;environment={{ selected_environment|urlencode }}">Siguiente</a>{% endif %}</div></nav>{% endif %}
