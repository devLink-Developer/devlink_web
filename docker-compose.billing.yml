# Optional overlay for the existing devLink deployment. Never mounts credentials under /app/media.
services:
  web:
    environment:
      BILLING_CERTIFICATE_ROOT: /run/devlink-arca
      BILLING_ALLOW_PRODUCTION: ${BILLING_ALLOW_PRODUCTION:-False}
    volumes:
      - type: bind
        source: ${BILLING_CERTIFICATE_ROOT_HOST:?Define la carpeta privada de certificados en el servidor}
        target: /run/devlink-arca
        read_only: true
