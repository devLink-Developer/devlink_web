<div class="invoice-line">{% for hidden in line_form.hidden_fields %}{{ hidden }}{{ hidden.errors }}{% endfor %}{{ line_form.non_field_errors }}<div class="line-description"><label for="{{ line_form.description.id_for_label }}">Descripción</label>{{ line_form.description }}{{ line_form.description.errors }}</div><div><label for="{{ line_form.quantity.id_for_label }}">Cantidad</label>{{ line_form.quantity }}{{ line_form.quantity.errors }}</div><div><label for="{{ line_form.unit_price.id_for_label }}">Precio unitario</label>{{ line_form.unit_price }}{{ line_form.unit_price.errors }}</div><div class="delete-line"><label>{{ line_form.DELETE }} Quitar</label></div></div>
